[project]
name = "cloud-relay"
version = "0.1.0"
description = "Consolidated AWS service wrappers: library, CLI, and API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
cli = ["typer>=0.12,<1", "rich>=13.7", "pyyaml>=6.0"]
api = ["fastapi>=0.136,<0.137", "uvicorn[standard]>=0.30"]
all = ["cloud-relay[cli,api]"]

[project.scripts]
cloud-relay = "cloud_relay.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "moto[s3,secretsmanager]>=5.0",
    "coverage>=7.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3,secretsmanager]",
    "httpx>=0.27",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_relay"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the intended FastAPI pattern, not a bug.
"src/cloud_relay/api/routers/*" = ["B008"]
"src/cloud_relay/api/deps.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cloud_relay"]
