# This entire file is commented out by default. To enable, remove the leading
# `# ` on every non-blank line (or in your editor: select all -> uncomment).
# Once uncommented, pushes will run lint/typecheck/test on every branch and
# build+publish to the project's GitLab Package Registry on tag pushes.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   - none for the default flow: $CI_JOB_TOKEN is auto-injected and has scope
#     to publish to this project's Package Registry.
